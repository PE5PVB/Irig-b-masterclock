; PlatformIO configuration for the IRIG-B122 master clock
; Backward compatible with Arduino IDE - the .ino stays in the root.

[platformio]
; Source directory is the root (where the .ino lives)
src_dir = .

[env:esp32]
; Requires Arduino-ESP32 core 3.x (pioarduino platform, as in TEF6686_ESP32)
platform = espressif32
board = esp32dev
framework = arduino

build_src_filter =
    +<*>
    -<.git/>
    -<.pio/>
    -<.vscode/>
    -<docs/>
    -<publish/>
    -<tools/>

board_build.f_cpu = 240000000L
upload_speed = 921600
monitor_speed = 115200

; Copy the merged firmware image to publish/ after every build
extra_scripts = post:tools/publish.py

lib_deps =
    olikraus/U8g2@^2.36.2
